<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
  <title>🍉 切水果 · 清晰实体版</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #2d1b0e; overflow: hidden; touch-action: none;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
      height: 100vh; width: 100vw;
      font-family: 'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
    }
    canvas { display:block; width:100%; height:100%; }
    .overlay {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(20,10,5,0.93); backdrop-filter: blur(8px);
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      z-index:10; transition: opacity 0.4s;
    }
    .hidden { opacity:0; pointer-events:none; }
    .mode-btn {
      background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,200,0.4);
      color: white; font-size: max(1.8vw, 1rem); font-weight: bold;
      padding: 1.2vh 3vw; border-radius: 30px; margin: 0.5vh;
      letter-spacing: 0.1em; transition: 0.2s;
    }
    .mode-btn.active {
      background: #ff6b6b; border-color: #ffd93d; box-shadow: 0 0 20px #ff6b6b;
      transform: scale(1.05);
    }
    .big-btn {
      background: linear-gradient(180deg,#ff7b3b,#c0392b); border:none; color:white;
      font-size: max(4vw, 1.5rem); font-weight:bold; padding: 2vh 8vw;
      border-radius: 60px; box-shadow:0 8px 0 #7b2c1f, 0 4px 15px black;
      letter-spacing:0.2em; margin: 1.5vh 0;
    }
    .shop-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.1); padding: 2vh 4vw; border-radius: 20px;
      width: 90%; max-width: 400px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- 开始菜单 -->
  <div id="menuScreen" class="overlay">
    <div style="font-size: max(8vw, 3rem); font-weight: 900;
                background: linear-gradient(45deg,#FF6B6B,#FFD93D,#6BCB77,#4D96FF);
                -webkit-background-clip: text; background-clip: text;
                -webkit-text-fill-color: transparent;
                filter: drop-shadow(0 0 20px #fff6); margin-bottom: 2vh;">
      🍒 切水果
    </div>
    <div style="font-size: max(3vw, 1.2rem); color: #ffd78c; letter-spacing: 0.3em; margin-bottom: 3vh;">
      连击 · 道具 · 模式
    </div>
    <div id="modeSelector" style="display:flex; gap: 2vw; margin-bottom: 3vh; flex-wrap: wrap; justify-content: center;">
      <button class="mode-btn active" data-mode="classic">🏆 经典</button>
      <button class="mode-btn" data-mode="arcade">⚡ 街机</button>
      <button class="mode-btn" data-mode="relax">🌸 休闲</button>
    </div>
    <div style="display: flex; gap: 15px; margin-bottom: 3vh; color: gold; font-size: max(4vw, 1.5rem); font-weight: bold;">
      💰 <span id="menuGold">0</span>
    </div>
    <button id="startBtn" class="big-btn">🔪 开始切</button>
    <button id="shopBtn" style="background: linear-gradient(180deg,#f1c40f,#e67e22); border:none; color:white;
      font-size: max(3.5vw, 1.3rem); font-weight:bold; padding: 1.8vh 6vw; border-radius: 40px;
      box-shadow:0 6px 0 #b8731b; margin-top: 2vh;">
      🛒 道具商店
    </button>
    <button id="dailyBtn" style="background: #9b59b6; border:none; color:white;
      font-size: max(3vw, 1.1rem); font-weight:bold; padding: 1.5vh 5vw; border-radius: 30px;
      box-shadow:0 5px 0 #6c3483; margin-top: 2vh;">
      🎁 每日签到 (+100💰)
    </button>
    <div style="color:#ccc; margin-top: 3vh; font-size: max(2.5vw, 0.9rem);">🕹️ 双手按住屏幕 → 两把刀跟随手指</div>
  </div>

  <!-- 商店界面 -->
  <div id="shopScreen" class="overlay hidden">
    <div style="font-size: max(5vw, 2rem); color: gold; margin-bottom: 2vh;">🛒 道具商店</div>
    <div style="color: white; font-size: max(3vw, 1.3rem); margin-bottom: 3vh;">💰 金币：<span id="shopGold">0</span></div>
    <div style="display: flex; flex-direction: column; gap: 2vh; align-items: center; width: 100%;">
      <div class="shop-item">
        <span style="font-size: max(3vw, 1.5rem);">🔪 锋利度</span>
        <span style="color: #ffd93d; font-weight: bold; font-size: max(2.5vw, 1.2rem);" id="sharpLv">Lv.1</span>
        <button id="upSharpBtn" style="background:#27ae60; border:none; color:white; padding:1.5vh 4vw; border-radius:25px; font-size: max(2.5vw, 1rem); box-shadow:0 4px 0 #1e8449;">
          ⬆️ <span id="sharpCost">100</span>💰
        </button>
      </div>
      <div class="shop-item">
        <span style="font-size: max(3vw, 1.5rem);">🔪 刀尺寸</span>
        <span style="color: #ffd93d; font-weight: bold; font-size: max(2.5vw, 1.2rem);" id="knifeLv">Lv.1</span>
        <button id="upKnifeBtn" style="background:#27ae60; border:none; color:white; padding:1.5vh 4vw; border-radius:25px; font-size: max(2.5vw, 1rem); box-shadow:0 4px 0 #1e8449;">
          ⬆️ <span id="knifeCost">150</span>💰
        </button>
      </div>
      <div class="shop-item">
        <span style="font-size: max(3vw, 1.5rem);">🪙 金币加成</span>
        <span style="color: #ffd93d; font-weight: bold; font-size: max(2.5vw, 1.2rem);" id="coinLv">Lv.1 (x1.0)</span>
        <button id="upCoinBtn" style="background:#27ae60; border:none; color:white; padding:1.5vh 4vw; border-radius:25px; font-size: max(2.5vw, 1rem); box-shadow:0 4px 0 #1e8449;">
          ⬆️ <span id="coinCost">200</span>💰
        </button>
      </div>
    </div>
    <button id="backMenuBtn" style="margin-top: 4vh; background: #7f8c8d; border:none; color:white; padding:1.8vh 8vw; border-radius:30px; font-size: max(3.5vw, 1.3rem); box-shadow:0 5px 0 #555;">↩️ 返回菜单</button>
  </div>

  <!-- 结算界面 -->
  <div id="gameoverScreen" class="overlay hidden">
    <div style="font-size: max(7vw, 3rem); color: #fff; margin-bottom: 2vh;">⏰ 时间到！</div>
    <div style="font-size: max(4vw, 1.8rem); color: gold; margin-bottom: 2vh;">本局得分 🎯 <span id="earnedScore">0</span></div>
    <div style="font-size: max(3vw, 1.3rem); color: white; margin-bottom: 3vh;">获得金币 💰 <span id="earnedGold">0</span></div>
    <div style="font-size: max(3vw, 1.3rem); color: white; margin-bottom: 3vh;">总金币 💰 <span id="totalGoldShow">0</span></div>
    <button id="replayBtn" style="background:#e74c3c; border:none; color:white; padding:2vh 8vw; border-radius:40px; font-size: max(4vw, 1.5rem); box-shadow:0 6px 0 #a8231a; margin-bottom:2vh;">🔄 再切一局</button>
    <button id="toShopBtn" style="background:#f39c12; border:none; color:white; padding:1.8vh 6vw; border-radius:30px; font-size: max(3.5vw, 1.3rem); box-shadow:0 5px 0 #b8731b;">🛒 去商店</button>
  </div>

  <audio id="menuMusic" loop preload="auto" src="开始菜单.mp3"></audio>
  <audio id="gameMusic" loop preload="auto" src="游玩时背景音乐.mp3"></audio>
  <audio id="overMusic" loop preload="auto" src="结算页面.mp3"></audio>

  <script>
    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let W, H;

      // ---------- 音乐 ----------
      const menuMusic = document.getElementById('menuMusic');
      const gameMusic = document.getElementById('gameMusic');
      const overMusic = document.getElementById('overMusic');
      let musicAllowed = false;
      function stopAllMusic() {
        menuMusic.pause(); menuMusic.currentTime = 0;
        gameMusic.pause(); gameMusic.currentTime = 0;
        overMusic.pause(); overMusic.currentTime = 0;
      }
      function playMenuMusic() {
        if (!musicAllowed) return;
        stopAllMusic();
        menuMusic.play().catch(()=>{});
      }
      function playGameMusic() {
        if (!musicAllowed) return;
        stopAllMusic();
        gameMusic.play().catch(()=>{});
      }
      function playOverMusic() {
        if (!musicAllowed) return;
        stopAllMusic();
        overMusic.play().catch(()=>{});
      }
      document.addEventListener('touchstart', () => {
        if(!musicAllowed) { musicAllowed=true; playMenuMusic(); }
      }, {once:true});

      // ---------- DOM ----------
      const menuScreen = document.getElementById('menuScreen');
      const shopScreen = document.getElementById('shopScreen');
      const gameoverScreen = document.getElementById('gameoverScreen');
      const menuGoldSpan = document.getElementById('menuGold');
      const shopGoldSpan = document.getElementById('shopGold');
      const sharpLvSpan = document.getElementById('sharpLv');
      const knifeLvSpan = document.getElementById('knifeLv');
      const coinLvSpan = document.getElementById('coinLv');
      const sharpCostSpan = document.getElementById('sharpCost');
      const knifeCostSpan = document.getElementById('knifeCost');
      const coinCostSpan = document.getElementById('coinCost');
      const earnedScoreSpan = document.getElementById('earnedScore');
      const earnedGoldSpan = document.getElementById('earnedGold');
      const totalGoldShowSpan = document.getElementById('totalGoldShow');
      const modeButtons = document.querySelectorAll('.mode-btn');

      // ---------- 游戏状态 ----------
      let gameState = 'menu';
      let currentMode = 'classic';
      let fruits = [];
      let particles = [];
      let touchPoints = [];
      window._lastTouchPos = [];
      let score = 0;
      let combo = 0;
      let lastSliceTime = 0;
      let gameTime = 60;
      let lastTimestamp = 0;
      let fruitSpawnTimer = 0;

      // 特殊效果计时
      let slowMotionUntil = 0;
      let doubleScoreUntil = 0;
      let freezeUntil = 0;       // 冰冻截止
      let magnetUntil = 0;       // 磁铁截止

      // 上次同种水果切割（用于组合技）
      let lastFruitType = null;
      let sameTypeStreak = 0;

      const modeSettings = {
        classic: { duration: 60, spawnInterval: 0.9, bombChance: 0.12, specialChance: 0.10, speedMult: 0.8 },
        arcade:  { duration: 45, spawnInterval: 0.6, bombChance: 0.10, specialChance: 0.16, speedMult: 0.95 },
        relax:   { duration: 90, spawnInterval: 1.3, bombChance: 0.03, specialChance: 0.08, speedMult: 0.65 }
      };

      // 持久化数据
      let totalGold = parseInt(localStorage.getItem('fruitGold') || '0');
      let sharpLevel = parseInt(localStorage.getItem('sharpLevel') || '1');
      let knifeLevel = parseInt(localStorage.getItem('knifeLevel') || '1');
      let coinBoostLevel = parseInt(localStorage.getItem('coinBoostLevel') || '1');
      let lastDailyDate = localStorage.getItem('lastDailyDate') || '';

      function sharpRadiusMultiplier() { return 1 + (sharpLevel - 1) * 0.15; }
      function knifeSizePx() { return 70 + (knifeLevel - 1) * 12; } // 基础70px，清晰可见
      function coinMultiplier() { return 1 + (coinBoostLevel - 1) * 0.5; }
      function sharpUpgradeCost() { return sharpLevel * 100; }
      function knifeUpgradeCost() { return knifeLevel * 150; }
      function coinUpgradeCost() { return coinBoostLevel * 200; }
      function saveData() {
        localStorage.setItem('fruitGold', totalGold);
        localStorage.setItem('sharpLevel', sharpLevel);
        localStorage.setItem('knifeLevel', knifeLevel);
        localStorage.setItem('coinBoostLevel', coinBoostLevel);
        localStorage.setItem('lastDailyDate', lastDailyDate);
      }

      // 每日签到
      function checkDaily() {
        const today = new Date().toDateString();
        if (lastDailyDate !== today) {
          lastDailyDate = today;
          totalGold += 100;
          saveData();
          updateGoldUI();
          alert('🎉 每日签到成功！获得 100 金币！');
        } else {
          alert('今日已签到，明天再来吧~');
        }
      }

      const fruitTypes = [
        { emoji: '🍎', score: 1, name: 'apple' },
        { emoji: '🍌', score: 2, name: 'banana' },
        { emoji: '🍊', score: 3, name: 'orange' },
        { emoji: '🍈', score: 5, name: 'durian' },
        { emoji: '🍉', score: 1, name: 'watermelon' },
        { emoji: '🍇', score: 1, name: 'grape' },
        { emoji: '🍓', score: 1, name: 'strawberry' }
      ];
      const bombEmoji = '💣';
      const doubleEmoji = '💎';
      const starEmoji = '⭐';
      const slowEmoji = '🐢';
      const tornadoEmoji = '🌀';
      const freezeEmoji = '❄️';  // 新道具：冰冻
      const magnetEmoji = '🧲';  // 新道具：磁铁

      // ---------- UI 更新 ----------
      function updateGoldUI() {
        menuGoldSpan.textContent = totalGold;
        shopGoldSpan.textContent = totalGold;
        totalGoldShowSpan.textContent = totalGold;
      }
      function updateShopUI() {
        sharpLvSpan.textContent = `Lv.${sharpLevel}`;
        knifeLvSpan.textContent = `Lv.${knifeLevel}`;
        coinLvSpan.textContent = `Lv.${coinBoostLevel} (x${coinMultiplier().toFixed(1)})`;
        sharpCostSpan.textContent = sharpUpgradeCost();
        knifeCostSpan.textContent = knifeUpgradeCost();
        coinCostSpan.textContent = coinUpgradeCost();
      }

      // 界面切换
      function showMenu() {
        gameState = 'menu';
        menuScreen.classList.remove('hidden');
        shopScreen.classList.add('hidden');
        gameoverScreen.classList.add('hidden');
        updateGoldUI();
        playMenuMusic();
      }
      function showShop() {
        gameState = 'shop';
        menuScreen.classList.add('hidden');
        shopScreen.classList.remove('hidden');
        gameoverScreen.classList.add('hidden');
        updateGoldUI();
        updateShopUI();
      }
      function startGame() {
        gameState = 'playing';
        menuScreen.classList.add('hidden');
        shopScreen.classList.add('hidden');
        gameoverScreen.classList.add('hidden');
        resetGame();
        lastTimestamp = performance.now();
        playGameMusic();
        requestAnimationFrame(gameLoop);
      }
      function showGameOver() {
        gameState = 'gameover';
        let earned = Math.floor(score * 10 * coinMultiplier());
        totalGold += earned;
        saveData();
        earnedScoreSpan.textContent = score;
        earnedGoldSpan.textContent = earned;
        updateGoldUI();
        gameoverScreen.classList.remove('hidden');
        playOverMusic();
      }

      function resetGame() {
        fruits = [];
        particles = [];
        touchPoints = [];
        window._lastTouchPos = [];
        score = 0;
        combo = 0;
        lastSliceTime = 0;
        let set = modeSettings[currentMode];
        gameTime = set.duration;
        fruitSpawnTimer = 0;
        slowMotionUntil = 0;
        doubleScoreUntil = 0;
        freezeUntil = 0;
        magnetUntil = 0;
        lastFruitType = null;
        sameTypeStreak = 0;
      }

      function spawnObject() {
        let set = modeSettings[currentMode];
        let rand = Math.random();
        if (rand < set.bombChance) {
          spawnItem(bombEmoji, 'bomb', -5);
          return;
        }
        let specialRand = Math.random();
        if (specialRand < set.specialChance) {
          // 随机分配7种特殊道具
          const items = ['slow', 'tornado', 'double', 'star', 'freeze', 'magnet', 'double']; // double概率稍高
          const chosen = items[Math.floor(Math.random() * items.length)];
          if (chosen === 'slow') spawnItem(slowEmoji, 'slow', 0);
          else if (chosen === 'tornado') spawnItem(tornadoEmoji, 'tornado', 0);
          else if (chosen === 'double') spawnItem(doubleEmoji, 'double', 0);
          else if (chosen === 'star') spawnItem(starEmoji, 'star', 0);
          else if (chosen === 'freeze') spawnItem(freezeEmoji, 'freeze', 0);
          else if (chosen === 'magnet') spawnItem(magnetEmoji, 'magnet', 0);
          return;
        }
        let fruit = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
        spawnFruit(fruit.emoji, fruit.score, fruit.name);
      }

      function spawnFruit(emoji, scoreVal, name) {
        let x = 50 + Math.random() * (W - 100);
        let y = H + 30;
        let vx = (Math.random() - 0.5) * 220;
        let vy = -800 - Math.random() * 400;
        let size = 55 + Math.floor(Math.random() * 45);
        fruits.push({
          type: 'fruit', emoji, scoreVal, name, x, y, vx, vy, size,
          rotation: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*6,
          sliced: false, isBomb: false
        });
      }

      function spawnItem(emoji, itemType, scoreVal) {
        let x = 50 + Math.random() * (W - 100);
        let y = H + 30;
        let vx = (Math.random() - 0.5) * 180;
        let vy = -750 - Math.random() * 350;
        let size = 65;
        fruits.push({
          type: itemType, emoji, scoreVal, x, y, vx, vy, size,
          rotation: 0, rotSpeed: (Math.random()-0.5)*3,
          sliced: false, isBomb: false, name: itemType
        });
      }

      function lineHitsCircle(x1,y1,x2,y2,cx,cy,r) {
        let dx = x2-x1, dy = y2-y1;
        let fx = x1-cx, fy = y1-cy;
        let a = dx*dx+dy*dy;
        let b = 2*(fx*dx+fy*dy);
        let c = fx*fx+fy*fy - r*r;
        let disc = b*b-4*a*c;
        if (disc<0) return false;
        disc = Math.sqrt(disc);
        let t1 = (-b-disc)/(2*a), t2 = (-b+disc)/(2*a);
        return (t1>=0&&t1<=1) || (t2>=0&&t2<=1);
      }

      function processSlice(fruit) {
        if (fruit.sliced) return;
        fruit.sliced = true;

        if (fruit.type === 'bomb') {
          combo = 0;
          score = Math.max(0, score - 5);
          for (let i=0;i<12;i++) {
            let ang = Math.random()*Math.PI*2;
            let spd = 200+Math.random()*300;
            particles.push({x:fruit.x, y:fruit.y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-100, life:0.6, maxLife:0.6, color:'#ff4444', size:5+Math.random()*6});
          }
          lastFruitType = null;
          sameTypeStreak = 0;
          return;
        }

        let now = performance.now();
        // 连击检测
        if (now - lastSliceTime < 1500) {
          combo++;
        } else {
          combo = 1;
        }
        lastSliceTime = now;

        // 同种水果组合技检测
        if (fruit.type === 'fruit') {
          if (lastFruitType === fruit.name && now - lastSliceTime < 2000) {
            sameTypeStreak++;
            if (sameTypeStreak >= 3) {
              // 触发组合技：额外加分并召唤旋风效果
              score += 20;
              // 清除屏幕所有非炸弹水果（模拟旋风）
              for (let f of fruits) {
                if (f !== fruit && !f.sliced && f.type !== 'bomb') {
                  processSlice(f);
                }
              }
              sameTypeStreak = 0;
            }
          } else {
            sameTypeStreak = 1;
          }
          lastFruitType = fruit.name;
        } else {
          lastFruitType = null;
          sameTypeStreak = 0;
        }

        let base = fruit.scoreVal || 0;
        if (now < doubleScoreUntil) base *= 2;
        let comboBonus = combo * 2;
        score += base + comboBonus;

        // 特殊道具效果
        if (fruit.type === 'star') {
          score += 10;
        } else if (fruit.type === 'double') {
          doubleScoreUntil = now + 10000;
        } else if (fruit.type === 'slow') {
          slowMotionUntil = now + 8000;
        } else if (fruit.type === 'freeze') {
          freezeUntil = now + 5000;   // 冰冻5秒
        } else if (fruit.type === 'magnet') {
          magnetUntil = now + 6000;   // 磁铁6秒
        } else if (fruit.type === 'tornado') {
          for (let f of fruits) {
            if (f === fruit) continue;
            if (!f.sliced && f.type !== 'bomb') {
              processSlice(f);
            }
          }
        }

        // 粒子
        for (let i=0;i<6;i++) {
          let ang = Math.random()*Math.PI*2;
          let spd = 100+Math.random()*200;
          particles.push({x:fruit.x, y:fruit.y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-80, life:0.5, maxLife:0.5, color:'#ffd93d', size:3+Math.random()*5});
        }
      }

      function updateTouches(e) {
        touchPoints = [];
        for (let i=0;i<e.touches.length && i<2;i++) {
          touchPoints.push({x:e.touches[i].clientX, y:e.touches[i].clientY});
        }
      }

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameState !== 'playing') return;
        updateTouches(e);
        window._lastTouchPos = touchPoints.map(p=>({x:p.x,y:p.y}));
      }, {passive: false});

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (gameState !== 'playing') return;
        let oldPoints = window._lastTouchPos || [];
        updateTouches(e);
        for (let i=0;i<touchPoints.length;i++) {
          if (i>=oldPoints.length) continue;
          let p1=oldPoints[i], p2=touchPoints[i];
          for (let fruit of fruits) {
            if (fruit.sliced) continue;
            let r = fruit.size * 0.45 * sharpRadiusMultiplier();
            if (lineHitsCircle(p1.x,p1.y,p2.x,p2.y, fruit.x, fruit.y, r)) {
              processSlice(fruit);
            }
          }
        }
        // 记录拖尾点
        if (touchPoints.length > 0) {
          window._sliceTrail = window._sliceTrail || [];
          window._sliceTrail.push({ x: touchPoints[0].x, y: touchPoints[0].y, time: performance.now(), color: '#ffaa00' });
          if (window._sliceTrail.length > 30) window._sliceTrail.shift();
        }
        window._lastTouchPos = touchPoints.map(p=>({x:p.x,y:p.y}));
      }, {passive: false});

      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (gameState !== 'playing') return;
        updateTouches(e);
        window._lastTouchPos = touchPoints.map(p=>({x:p.x,y:p.y}));
        window._sliceTrail = [];
      });

      canvas.addEventListener('touchcancel', () => {
        touchPoints = [];
        window._lastTouchPos = [];
        window._sliceTrail = [];
      });

      function gameLoop(now) {
        if (gameState !== 'playing') return;
        requestAnimationFrame(gameLoop);
        let dt = (now - lastTimestamp)/1000;
        if (dt>0.2) dt=0.2;
        lastTimestamp = now;

        gameTime -= dt;
        if (gameTime <= 0) { gameTime=0; showGameOver(); return; }

        let set = modeSettings[currentMode];
        fruitSpawnTimer += dt;
        while (fruitSpawnTimer >= set.spawnInterval) {
          fruitSpawnTimer -= set.spawnInterval;
          spawnObject();
          if (Math.random()<0.4) spawnObject();
        }

        let gravity = 980;
        if (now < slowMotionUntil) gravity *= 0.4;
        let speedMult = set.speedMult;
        const frozen = now < freezeUntil;
        const magnetActive = now < magnetUntil;

        for (let i=fruits.length-1;i>=0;i--) {
          let f = fruits[i];
          if (frozen) {
            // 冰冻：停止移动，但仍旋转
            f.rotation += f.rotSpeed * dt;
            continue;
          }
          f.vy += gravity * dt;
          f.x += f.vx * speedMult * dt;
          f.y += f.vy * speedMult * dt;
          f.rotation += f.rotSpeed * dt;

          // 磁铁效果：吸引向最近的触摸点或中心
          if (magnetActive && !f.sliced && f.type !== 'bomb') {
            let targetX = W/2, targetY = H/2;
            if (touchPoints.length > 0) {
              targetX = touchPoints[0].x;
              targetY = touchPoints[0].y;
            }
            let dx = targetX - f.x;
            let dy = targetY - f.y;
            let dist = Math.sqrt(dx*dx+dy*dy);
            if (dist > 1) {
              let pullStrength = 300; // 吸引力
              f.vx += (dx/dist) * pullStrength * dt;
              f.vy += (dy/dist) * pullStrength * dt;
            }
          }

          if (f.y - f.size > H + 130 || (f.sliced && f.y > H+250)) fruits.splice(i,1);
        }

        // 更新粒子 & 拖尾
        for (let i=particles.length-1;i>=0;i--) {
          let p = particles[i];
          p.life -= dt;
          if (p.life<=0) { particles.splice(i,1); continue; }
          p.x += p.vx*dt;
          p.y += p.vy*dt;
          p.vy += 400*dt;
        }
        if (window._sliceTrail) {
          window._sliceTrail = window._sliceTrail.filter(p => now - p.time < 0.3);
        }

        if (now - lastSliceTime > 1500) combo = 0;

        drawBackground();
        drawFruits();
        drawParticles();
        drawSliceTrail();
        drawKnives();
        drawHUD();
      }

      function drawBackground() {
        let grad = ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0,'#1a0b02'); grad.addColorStop(0.7,'#3e1f0d'); grad.addColorStop(1,'#6b3a1f');
        ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
        ctx.fillStyle='rgba(255,255,200,0.03)';
        for(let i=0;i<8;i++) ctx.fillRect(0,i*H/7,W,2);
      }

      function drawFruits() {
        for (let f of fruits) {
          ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rotation);
          ctx.font = `${f.size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",system-ui`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          // 水果阴影，使其更立体清晰
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 4;
          ctx.fillText(f.emoji, 0, 0);
          // 去掉高光，直接再绘制一层加深颜色（恢复阴影）
          ctx.shadowColor = 'transparent';
          ctx.fillText(f.emoji, 0, 0);
          // 切割裂纹
          if (f.sliced) {
            ctx.shadowBlur = 0;
            ctx.strokeStyle='#fff';
            ctx.lineWidth=2;
            ctx.beginPath();
            ctx.moveTo(-f.size*0.3,-f.size*0.3);
            ctx.lineTo(f.size*0.3,f.size*0.3);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(f.size*0.3,-f.size*0.3);
            ctx.lineTo(-f.size*0.3,f.size*0.3);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawParticles() {
        for (let p of particles) {
          ctx.save(); ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore();
        }
      }

      function drawSliceTrail() {
        if (!window._sliceTrail || window._sliceTrail.length < 2) return;
        ctx.save();
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#ffaa00';
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(window._sliceTrail[0].x, window._sliceTrail[0].y);
        for (let i=1; i<window._sliceTrail.length; i++) {
          ctx.lineTo(window._sliceTrail[i].x, window._sliceTrail[i].y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawKnives() {
        if (touchPoints.length===0) return;
        let knifeSize = knifeSizePx();
        for (let i=0;i<touchPoints.length;i++) {
          let pt=touchPoints[i];
          let angle=-Math.PI/4;
          if (window._lastTouchPos && i<window._lastTouchPos.length) {
            let prev=window._lastTouchPos[i];
            let dx=pt.x-prev.x, dy=pt.y-prev.y;
            if(Math.abs(dx)>1||Math.abs(dy)>1) angle=Math.atan2(dy,dx)+Math.PI/2;
          }
          ctx.save(); ctx.translate(pt.x,pt.y); ctx.rotate(angle);
          ctx.font = `${knifeSize}px "Segoe UI Emoji","Apple Color Emoji"`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          // 刀身实体化：添加黑色描边和微弱阴影
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 3;
          ctx.fillText('🔪', 0, 0);
          ctx.shadowColor = 'transparent';
          ctx.fillText('🔪', 0, 0);
          ctx.restore();
        }
      }

      function drawHUD() {
        const hudFontSize = Math.max(W * 0.04, 18);
        const smallFontSize = Math.max(W * 0.03, 14);
        ctx.save();
        ctx.font = `bold ${hudFontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
        ctx.fillStyle='#fff'; ctx.shadowColor='#000'; ctx.shadowBlur=6;
        ctx.textAlign='left';
        let min=Math.floor(gameTime/60), sec=Math.floor(gameTime%60);
        let modeName = {classic:'🏆经典', arcade:'⚡街机', relax:'🌸休闲'}[currentMode];
        ctx.fillText(`${modeName} ⏳${min}:${sec.toString().padStart(2,'0')}`, 15, 45);
        ctx.textAlign='right';
        ctx.fillText(`🎯${score}  🔥连击x${combo}`, W-15, 45);
        // 状态图标
        let now = performance.now();
        ctx.font = `${smallFontSize}px "PingFang SC", sans-serif`;
        ctx.textAlign='left';
        let yOff = 70;
        if (now < slowMotionUntil) { ctx.fillText('🐢减速', 15, yOff); yOff += 25; }
        if (now < doubleScoreUntil) { ctx.fillText('💎双倍', 15, yOff); yOff += 25; }
        if (now < freezeUntil) { ctx.fillText('❄️冰冻', 15, yOff); yOff += 25; }
        if (now < magnetUntil) { ctx.fillText('🧲磁铁', 15, yOff); }
        ctx.restore();
      }

      // 按钮事件
      document.getElementById('startBtn').addEventListener('click', startGame);
      document.getElementById('shopBtn').addEventListener('click', showShop);
      document.getElementById('backMenuBtn').addEventListener('click', showMenu);
      document.getElementById('replayBtn').addEventListener('click', startGame);
      document.getElementById('toShopBtn').addEventListener('click', showShop);
      document.getElementById('dailyBtn').addEventListener('click', checkDaily);

      document.getElementById('upSharpBtn').addEventListener('click', ()=>{
        let cost=sharpUpgradeCost();
        if(totalGold>=cost){ totalGold-=cost; sharpLevel++; saveData(); updateGoldUI(); updateShopUI(); }
        else alert('金币不足！');
      });
      document.getElementById('upKnifeBtn').addEventListener('click', ()=>{
        let cost=knifeUpgradeCost();
        if(totalGold>=cost){ totalGold-=cost; knifeLevel++; saveData(); updateGoldUI(); updateShopUI(); }
        else alert('金币不足！');
      });
      document.getElementById('upCoinBtn').addEventListener('click', ()=>{
        let cost=coinUpgradeCost();
        if(totalGold>=cost){ totalGold-=cost; coinBoostLevel++; saveData(); updateGoldUI(); updateShopUI(); }
        else alert('金币不足！');
      });

      modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          modeButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
        });
      });

      function resizeCanvas() { W=window.innerWidth; H=window.innerHeight; canvas.width=W; canvas.height=H; }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      showMenu();
      updateGoldUI();
      updateShopUI();
      window.addEventListener('blur', ()=>{ touchPoints=[]; window._lastTouchPos=[]; window._sliceTrail=[]; });
    })();
  </script>
</body>
</html>
